{% extends "base.html" %}

{% block title %}Register - FAST CARS Rental Booking System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="content-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h3 class="text-white">Create Your Account</h3>
                    <p class="text-white-50 small">Join FAST CARS to instantly reserve and track vehicle rentals.</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="full_name" class="form-control" placeholder="Johnathan Doe" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Password (Min 8 chars) <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="Include country code">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Street Address</label>
                            <input type="text" name="address" class="form-control" placeholder="123 Ocean Blvd">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">City</label>
                            <input type="text" name="city" class="form-control" placeholder="Your city">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Country</label>
                            <input type="text" name="country" class="form-control" placeholder="United States">
                        </div>

                        <div class="col-12 mt-4">
                            <div class="form-check text-white-50 small mb-3">
                                <input class="form-check-input" type="checkbox" id="termsCheck" name="terms_accepted" value="yes" required>
                                <label class="form-check-label" for="termsCheck">
                                    I agree to the FAST CARS <a href="{{ url_for('terms') }}" class="text-primary text-decoration-none" target="_blank">Terms of Service</a> and <a href="{{ url_for('privacy') }}" class="text-primary text-decoration-none" target="_blank">Privacy Policy</a>.
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">
                                <i class="fa-solid fa-user-check me-2"></i> Complete Registration
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center text-white-50 small mt-4 pt-3 border-top border-secondary border-opacity-25">
                    Already registered? 
                    <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
