{% extends "base.html" %}

{% block title %}Choose a New Password - FAST CARS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="content-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="text-white">Choose a new password</h3>
                    <p class="text-white-50 small">Enter the code sent to your email. Codes expire in 10 minutes and can only be used once.</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Account email</label>
                        <input type="email" name="email" class="form-control" autocomplete="email" value="{{ email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Six-digit reset code</label>
                        <input type="text" name="code" class="form-control text-center fs-4" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">New password</label>
                        <input type="password" name="new_password" class="form-control" minlength="8" autocomplete="new-password" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50 small">Confirm new password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill">Reset password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
