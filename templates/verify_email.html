{% extends "base.html" %}

{% block title %}Verify Your Email - FAST CARS{% endblock %}

{% block content %}
<script>sessionStorage.removeItem('fastcars.registration-draft.v1');</script>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="content-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;"><i class="fa-solid fa-envelope-circle-check"></i></div>
                    <h3 class="text-white">Verify your email</h3>
                    <p class="text-white-50 small">Enter the six-digit code sent to {{ email }}. The code expires in 10 minutes.</p>
                </div>
                <form action="{{ url_for('verify_email') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="email" value="{{ email }}">
                    <input type="hidden" name="action" value="verify">
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Verification code</label>
                        <input type="text" name="code" class="form-control text-center fs-4" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill">Verify email</button>
                </form>
                <form action="{{ url_for('verify_email') }}" method="POST" class="text-center mt-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="email" value="{{ email }}">
                    <input type="hidden" name="action" value="resend">
                    <button type="submit" class="btn btn-link text-primary">Send a new code</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
