{% extends "admin/base_admin.html" %}

{% block page_title %}Edit Vehicle Brand{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="admin-card">
            <h5 class="text-white mb-3"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Update Brand: {{ brand.name }}</h5>
            <form action="{{ url_for('admin_brand_edit', brand_id=brand.id) }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label text-white-50 small">Brand Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ brand.name }}" required autofocus>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('admin_brands') }}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
