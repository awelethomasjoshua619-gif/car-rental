<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - FAST CARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261108-light">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=20261108-light">
</head>
<body class="admin-auth-page">
    <main class="admin-login-card">
        <h4 class="text-white mb-2">Reset admin password</h4>
        <p class="text-white-50 small">Enter the six-digit code sent to your administrator email and choose a password of at least 12 characters.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label text-white-50 small">Administrator email</label>
            <input type="email" name="email" class="form-control mb-3" value="{{ email or '' }}" required>
            <label class="form-label text-white-50 small">Six-digit code</label>
            <input type="text" name="code" class="form-control text-center fs-4 mb-3" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
            <label class="form-label text-white-50 small">New password</label>
            <input type="password" name="new_password" class="form-control mb-3" minlength="12" autocomplete="new-password" required>
            <label class="form-label text-white-50 small">Confirm password</label>
            <input type="password" name="confirm_password" class="form-control mb-3" minlength="12" autocomplete="new-password" required>
            <button class="btn btn-primary w-100">Reset admin password</button>
        </form>
    </main>
</body>
</html>
