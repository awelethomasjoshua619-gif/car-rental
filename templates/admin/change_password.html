{% extends "admin/base_admin.html" %}

{% block page_title %}Change Administrator Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="admin-card">
            <h5 class="text-white mb-3"><i class="fa-solid fa-key text-primary me-2"></i> Update Security Credentials</h5>
            <p class="text-white-50 small mb-4">Ensure your administrator account uses a strong, private password.</p>

            <form action="{{ url_for('admin_change_password') }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Current Administrator Password <span class="text-danger">*</span></label>
                    <input type="password" name="current_password" class="form-control" placeholder="••••••••" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white-50 small">New Password (Min 6 chars) <span class="text-danger">*</span></label>
                    <input type="password" name="new_password" class="form-control" placeholder="At least 12 characters" minlength="12" autocomplete="new-password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white-50 small">Confirm New Password <span class="text-danger">*</span></label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="At least 12 characters" minlength="12" autocomplete="new-password" required>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
