<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Recovery - FAST CARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261108-light">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=20261108-light">
</head>
<body class="admin-auth-page">
    <button type="button" class="btn btn-outline-secondary btn-sm text-white-50 position-fixed top-0 start-0 m-3" onclick="if (history.length > 1) { history.back(); } else { window.location.href='{{ url_for('admin_login') }}'; }">
        <i class="fa-solid fa-arrow-left me-1"></i> Back
    </button>
    <main class="admin-login-card">
        <h4 class="text-white mb-2">Admin password recovery</h4>
        <p class="text-white-50 small">Enter the email assigned to the administrator account. If it matches, a 10-minute reset code will be sent.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label text-white-50 small">Administrator email</label>
            <input type="email" name="email" class="form-control mb-3" autocomplete="email" required autofocus>
            <button class="btn btn-primary w-100">Send reset code</button>
        </form>
        <a href="{{ url_for('admin_login') }}" class="d-block text-center mt-3 text-primary">Back to admin sign in</a>
    </main>
</body>
</html>
